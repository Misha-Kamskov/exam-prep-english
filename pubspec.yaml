name: exam_prep_english
description: "English exam preparation application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^4.0.1

  # State Management
  flutter_bloc: ^9.1.1
